name: QA Platform build and test workflow

on:
  pull_request:
    branches: [ "main", "dev", "spike/deployment" ]
  push:
    branches: [ "main", "dev", "spike/deployment" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
  
    - name: Inject Secrets into .env
      run: |
        cp EventFoodOrders/.env.template EventFoodOrders/.env
        
        sed -i "s|\${AZURE_AD_TENANT_ID}|${{ secrets.AZURE_AD_TENANT_ID }}|g" EventFoodOrders/.env
        sed -i "s|\${AZURE_AD_CLIENT_ID}|${{ secrets.AZURE_AD_CLIENT_ID }}|g" EventFoodOrders/.env
        sed -i "s|\${AZURE_AD_CLIENT_SECRET}|${{ secrets.AZURE_AD_CLIENT_SECRET }}|g" EventFoodOrders/.env
        
        sed -i "s|\${JWT_ISSUER}|${{ secrets.JWT_ISSUER }}|g" EventFoodOrders/.env
        sed -i "s|\${JWT_AUDIENCE}|${{ secrets.JWT_AUDIENCE }}|g" EventFoodOrders/.env
        sed -i "s|\${JWT_SECRET}|${{ secrets.JWT_SECRET }}|g" EventFoodOrders/.env

        sed -i "s|\${DB_CONNECTION_STRING}|${{ secrets.DB_CONNECTION_STRING }}|g" EventFoodOrders/.env

    - name: Start Database with Docker Compose
      run: docker compose -f docker-compose.staging.yml up -d event-food-orders-api

    - name: Start API Container
      run: docker compose -f docker-compose.staging.yml up -d event-food-orders-db

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Stop and clean up containers
      run: docker compose -f docker-compose.staging.yml down

  build-and-push:
    needs: [run-tests]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Inject Secrets into .env
        run: |
          cp EventFoodOrders/.env.template EventFoodOrders/.env
          sed -i "s|\${AZURE_AD_TENANT_ID}|${{ secrets.AZURE_AD_TENANT_ID }}|g" EventFoodOrders/.env
          sed -i "s|\${AZURE_AD_CLIENT_ID}|${{ secrets.AZURE_AD_CLIENT_ID }}|g" EventFoodOrders/.env
          sed -i "s|\${AZURE_AD_CLIENT_SECRET}|${{ secrets.AZURE_AD_CLIENT_SECRET }}|g" EventFoodOrders/.env
          sed -i "s|\${JWT_ISSUER}|${{ secrets.JWT_ISSUER }}|g" EventFoodOrders/.env
          sed -i "s|\${JWT_AUDIENCE}|${{ secrets.JWT_AUDIENCE }}|g" EventFoodOrders/.env
          sed -i "s|\${JWT_SECRET}|${{ secrets.JWT_SECRET }}|g" EventFoodOrders/.env

      - name: Determine Image Tag
        run: echo "IMAGE_TAG=pr-${{ github.event.pull_request.number || github.sha }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/event-food-orders-api:${{ env.IMAGE_TAG }} .

      - name: Push Docker image to GitHub Container Registry
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/event-food-orders-api:${{ env.IMAGE_TAG }}